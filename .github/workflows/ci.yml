name: CI

on: [push]
jobs:
  check-push-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: 
          node-version: '25'

      - name: Instalar dependências e testar
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          npm install
          npm test

      - name: Validar Build do Docker
        run: |
          docker build -t contaapi-teste .